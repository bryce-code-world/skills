interface:
  display_name: "后端开发"
  short_description: "以业务域文档为控制面，贯通后端设计、AI开发、Review与交付"
  default_prompt: "使用 $backend-development 从需求材料、现有事实和业务域根目录 README.md、Progress.md 开始；缺少任一文档时先初始化并从 S1 建立业务模型初识，存在文档时先恢复当前 P/S、工作对象和唯一下一步，再按当前步骤推进。每轮只推进一个确认点；切片完成后说明下一步并询问是否开始。"

policy:
  allow_implicit_invocation: true
